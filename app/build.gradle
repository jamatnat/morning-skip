plugins {
    id 'com.android.application'
}

def ciKeystorePath = System.getenv('MORNINGSKIP_KEYSTORE')
if (System.getenv('GITHUB_ACTIONS') == 'true' && !ciKeystorePath) {
    throw new GradleException('MORNINGSKIP_KEYSTORE must point to the restored signing key in CI')
}

android {
    namespace 'io.github.jamatnat.morningskip'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.jamatnat.morningskip"
        minSdk 30
        targetSdk 35
        versionCode 4
        versionName "1.0.3"
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        debug {
            if (ciKeystorePath) {
                storeFile file(ciKeystorePath)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
}
