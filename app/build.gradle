plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.jamatnat.morningskip'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.jamatnat.morningskip"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
}
