name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check signing secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo '::error::Add the repository secret ANDROID_DEBUG_KEYSTORE_BASE64, then re-run this workflow. See docs/GUIDE.md#github-actions-setup.'
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run policy checks
        run: sh tests/run-tests.sh

      - name: Prepare Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;34.0.0'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null

      - name: Build APK
        run: bash ./gradlew --no-daemon --console=plain assembleDebug

      - name: Verify and package APK
        run: |
          mkdir -p build/artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/MorningSkip.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs build/artifacts/MorningSkip.apk
          cd build/artifacts
          sha256sum MorningSkip.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MorningSkip-apk-${{ github.run_number }}
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Remove runner signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
