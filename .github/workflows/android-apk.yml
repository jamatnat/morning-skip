name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check signing secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo '::error::Add the repository secret ANDROID_DEBUG_KEYSTORE_BASE64, then re-run this workflow. See docs/GUIDE.md#github-actions-setup.'
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run policy checks
        run: sh tests/run-tests.sh

      - name: Prepare Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;34.0.0'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          umask 077
          MORNINGSKIP_KEYSTORE="$RUNNER_TEMP/morningskip-debug.keystore"
          echo "MORNINGSKIP_KEYSTORE=$MORNINGSKIP_KEYSTORE" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$MORNINGSKIP_KEYSTORE"
          keytool -exportcert -keystore "$MORNINGSKIP_KEYSTORE" -storepass android \
            -alias androiddebugkey -file "$RUNNER_TEMP/morningskip-cert.der"

      - name: Build APK
        run: bash ./gradlew --no-daemon --console=plain assembleDebug

      - name: Verify and package APK
        id: package
        run: |
          python3 - <<'PYVERSION'
          import json, os, re
          with open('app/build/outputs/apk/debug/output-metadata.json') as f:
              version = json.load(f)['elements'][0]['versionName']
          if not re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,2}', version):
              raise SystemExit('Public releases require a numeric version such as 1.0 or 1.0.1')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('version=' + version + '\n')
          PYVERSION
          mkdir -p build/artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/MorningSkip.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs build/artifacts/MorningSkip.apk \
            | tee "$RUNNER_TEMP/morningskip-signature.txt"
          expected=$(sha256sum "$RUNNER_TEMP/morningskip-cert.der" | cut -d ' ' -f 1)
          actual=$(awk -F': ' '/^Signer #1 certificate SHA-256 digest:/ {print $2}' "$RUNNER_TEMP/morningskip-signature.txt")
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo '::error::APK signature does not match the repository signing key. Publication stopped.'
            exit 1
          fi
          echo "Signing key verified: $actual"
          cd build/artifacts
          sha256sum MorningSkip.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MorningSkip-apk-${{ github.run_number }}
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Remove runner signing key
        if: always()
        run: rm -f "$MORNINGSKIP_KEYSTORE" "$RUNNER_TEMP/morningskip-cert.der"

  release:
    name: Publish version to Releases
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check for an existing release
        id: release
        shell: bash
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists; leaving its APK unchanged."
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified APK
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MorningSkip-apk-${{ github.run_number }}
          path: artifacts

      - name: Publish APK and checksum
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Automatically dismiss the OnePlus Watch 3 greeting.

          Download **MorningSkip.apk** below and install it on your watch using ADB.
          Enable **MorningSkip** in Accessibility, then turn **Good Morning Auto-close ON**.

          This APK is a signed debug build, with local diagnostics export enabled.
          Other watch models and firmware versions are untested.
          NOTES
          if [[ "$VERSION" == '1.0.2' ]]; then
            cat >> release-notes.md <<'NOTES'

          **Signing fix:** versions 1.0 and 1.0.1 were signed with different certificates.
          If Android reports a signature conflict, uninstall the old copy once, install this APK,
          and enable Accessibility and Auto-close again. Uninstalling removes app settings and logs.
          This version explicitly uses the repository signing key and checks the APK certificate before publishing.
          NOTES
          fi
          gh release create "v$VERSION" MorningSkip.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "MorningSkip $VERSION" \
            --notes-file release-notes.md
